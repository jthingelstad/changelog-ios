name: test

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Version arithmetic
        run: scripts/version.sh test
      - name: ChangelogKit tests
        run: swift test --package-path ChangelogKit
      # TestFlight builds are optimized, and the optimizer has broken code
      # Debug ran fine (a task group, build 53's crash on launch).
      - name: ChangelogKit tests, optimized
        run: swift test -c release -Xswiftc -enable-testing --package-path ChangelogKit
      - name: Build the app for the simulator
        run: >
          xcodebuild -project Changelog.xcodeproj -scheme Changelog
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath build/dd CODE_SIGNING_ALLOWED=NO build
